<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bordeaux, Port de la Lune</title>
  <meta name="description" content="Carte 3D des monuments historiques de Bordeaux">
  <meta name="theme-color" content="#f2eee5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icone-192.png">
  <link rel="apple-touch-icon" href="img/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Port de la Lune">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css?v=31">
</head>
<body>
  <div id="map" data-i18n-aria="carte.aria" aria-label="Carte 3D du centre historique de Bordeaux"></div>

  <header class="card titre" id="titre">
    <p class="kicker" data-i18n="titre.kicker">Bordeaux · Patrimoine mondial de l'UNESCO</p>
    <h1>Port de la Lune</h1>
    <p class="sous-titre" data-i18n="titre.sous">Les monuments historiques du centre, en relief</p>
    <div class="legende" id="legende" role="group" data-i18n-aria="legende.aria" aria-label="Époques"></div>
    <p class="legende-aide" data-i18n="legende.aide">Touchez une époque pour l'isoler.</p>
    <button class="btn-promenades" id="btn-promenades" aria-expanded="false" aria-controls="promenades">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="4" r="2.2"/><path d="M10.2 8.6 13 7.7c.9-.3 1.8.1 2.2.9l1.2 2.5 2.6 1.2-.7 1.6-3.2-1.4-.8-1.6-1 3.9 2.4 2.6.9 5.1h-1.9l-.8-4.2-2.5-2.4-.9 3.6-4.2 3-.9-1.5 3.6-2.6 1.6-6.6-1.6.6-1 2.9-1.7-.5 1.3-3.8z"/></svg>
      <span data-i18n="btn.promenades">Promenades à pied depuis l'hôtel</span><span class="fleche" aria-hidden="true">→</span>
    </button>
  </header>

  <aside class="card promenades" id="promenades" hidden data-i18n-aria="pr.aria" aria-label="Promenades à pied depuis l'hôtel">
    <button class="fermer" id="promenades-fermer" data-i18n-aria="pr.fermer" aria-label="Fermer les promenades">×</button>
    <div class="pr-defile" id="pr-contenu"></div>
  </aside>

  <nav class="card liste" id="liste" data-i18n-aria="liste.aria" aria-label="Liste des monuments">
    <button class="liste-tete" id="liste-bascule" aria-expanded="true" aria-controls="liste-corps" title="Masquer la liste">
      <span class="liste-icone" aria-hidden="true">☰</span><span data-i18n="liste.titre">Les monuments</span>
      <span class="nb" id="liste-nb"></span><span class="chevron" aria-hidden="true">▾</span>
    </button>
    <div class="liste-corps" id="liste-corps"></div>
  </nav>

  <aside class="card fiche" id="fiche" hidden role="dialog" aria-labelledby="fiche-nom">
    <button class="fermer" id="fiche-fermer" data-i18n-aria="fiche.fermer" aria-label="Fermer la fiche">×</button>
    <div class="fiche-defile">
      <figure class="galerie" id="galerie">
        <div class="photo-cadre">
          <img id="photo-a" alt="">
          <img id="photo-b" alt="" class="cache">
          <div class="periodes" role="tablist" data-i18n-aria="fiche.periodes" aria-label="Époque de la photo">
            <button role="tab" data-p="autrefois" aria-selected="true">Autrefois</button>
            <button role="tab" data-p="aujourdhui" aria-selected="false" data-i18n="fiche.aujourdhui">Aujourd'hui</button>
          </div>
          <button class="agrandir" id="agrandir" data-i18n-aria="fiche.agrandir" data-i18n-title="fiche.agrandir" aria-label="Voir la photo en grand" title="Voir la photo en grand">⤢</button>
        </div>
        <figcaption><span class="legende-photo" id="photo-legende"></span><span class="credit" id="photo-credit"></span></figcaption>
        <div class="vignettes" id="vignettes"></div>
      </figure>
      <div class="fiche-corps">
        <p class="fiche-epoque" id="fiche-epoque"></p>
        <h2 id="fiche-nom"></h2>
        <p class="fiche-dates" id="fiche-dates"></p>
        <p class="fiche-texte" id="fiche-texte"></p>
        <section class="fiche-bloc" id="bloc-regarder"><h3 data-i18n="fiche.regarder">À regarder</h3><p id="fiche-regarder"></p></section>
        <aside class="fiche-savez" id="bloc-savez"><h3 data-i18n="fiche.savez">Le saviez-vous ?</h3><p id="fiche-savez"></p></aside>
        <section class="fiche-bloc fiche-visite" id="bloc-visite"><h3 data-i18n="fiche.visite">Visite</h3><p id="fiche-visite"></p></section>
        <p class="fiche-liens" id="fiche-liens"></p>
        <p class="fiche-sources" id="fiche-sources"></p>
      </div>
    </div>
  </aside>

  <div class="apercu" id="apercu" hidden aria-hidden="true"></div>

  <div class="visionneuse" id="visionneuse" hidden role="dialog" data-i18n-aria="visionneuse.aria" aria-label="Photo en grand">
    <button class="fermer" id="visionneuse-fermer" data-i18n-aria="fermer" aria-label="Fermer">×</button>
    <img id="visionneuse-img" alt="">
    <p id="visionneuse-legende"></p>
  </div>

  <div class="outils" role="toolbar" data-i18n-aria="outils.aria" aria-label="Vue">
    <div class="langue">
      <button id="btn-langue" data-i18n-title="langue.titre" title="Changer de langue" aria-haspopup="true" aria-expanded="false">FR</button>
      <div class="menu-langue" id="menu-langue" role="menu" hidden></div>
    </div>
    <button id="btn-geo" data-i18n-title="geo.bouton" title="Me localiser" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></button>
    <button id="btn-tour" data-i18n-title="outils.tour" title="Faire tourner la vue" aria-pressed="false">⟳</button>
    <button id="btn-3d" data-i18n-title="outils.3d" title="Basculer vue 2D / 3D">2D</button>
    <button id="btn-accueil" data-i18n-title="outils.accueil" title="Revenir à la vue d'ensemble">⌂</button>
  </div>

  <div class="card proche" id="proche" hidden aria-live="polite"></div>
  <p class="message" id="message" hidden role="status"></p>

  <p class="credits" data-i18n="credits">Bâtiments © IGN BD TOPO · Monuments et arbres © contributeurs OpenStreetMap · Prototype</p>

  <script src="vendor/maplibre-gl.js"></script>
  <script type="module" src="js/app.js?v=32"></script>
</body>
</html>
