<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Port de la Lune — affiche A3</title>
  <!-- Affiche A3 pour l'accueil : la ville entière, les 22 monuments numérotés et leur résumé, le QR code du site.
       Imprimer depuis le navigateur (format A3, marges : aucune), ou régénérer affiche-port-de-la-lune-a3.pdf
       avec scripts/affiche.sh. Carte : img/affiche/carte-a3.jpg ; positions des monuments sur cette image :
       img/affiche/carte-a3.json (voir scripts/affiche.sh pour refaire la capture). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchemin: #f3e8d4; --filet: #c9b088;
      --brun: #3b2a1d; --brun-doux: #6e5a45; --bordeaux: #7a2340;
      --serif: 'Cormorant Garamond', Georgia, serif; --sans: Inter, -apple-system, sans-serif;
    }
    @page { size: A3; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #8d8273; font-family: var(--sans); color: var(--brun); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    .affiche {
      position: relative; width: 297mm; height: 420mm; margin: 10mm auto; padding: 12mm 13mm 10mm;
      background: var(--parchemin); /* même teinte que le fond de la capture : la carte se fond dans la feuille */
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    /* double filet, comme le cadre d'une carte ancienne */
    .affiche::before, .affiche::after { content: ''; position: absolute; pointer-events: none; border: .7mm solid var(--brun); }
    .affiche::before { inset: 6mm; }
    .affiche::after { inset: 7.6mm; border-width: .25mm; border-color: var(--filet); }

    /* ---------- carte ---------- */
    .carte { position: relative; width: 100%; aspect-ratio: 1200 / 918; flex: none; }
    .carte img, .carte svg.calque { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .titre { position: absolute; left: 1mm; top: -1mm; }
    .kicker { margin: 0; font-size: 8pt; letter-spacing: .17em; text-transform: uppercase; font-weight: 600; color: var(--bordeaux); }
    h1 { margin: 1mm 0 0; font-family: var(--serif); font-weight: 600; font-size: 50pt; line-height: .9; letter-spacing: -.01em; white-space: nowrap; }
    .sous { margin: 2.5mm 0 0; max-width: 72mm; font-family: var(--serif); font-size: 14pt; font-weight: 600; line-height: 1.12; }
    .intro { margin: 2mm 0 0; max-width: 60mm; font-family: var(--serif); font-style: italic; font-size: 11pt; line-height: 1.2; color: var(--brun-doux); }

    .legende { position: absolute; left: 1mm; bottom: 3mm; display: grid; gap: 1.6mm; font-size: 8.4pt; font-weight: 500; }
    .legende span { display: flex; align-items: center; gap: 2mm; }
    .legende i { flex: none; width: 4mm; height: 4mm; border-radius: 50%; border: .45mm solid #fff; box-shadow: 0 .3mm .6mm rgba(0,0,0,.25); }
    .legende i.h { border-radius: 1mm; background: #22252b; }
    .legende i.pr { width: 6mm; height: 0; border: 0; border-top: .7mm dotted var(--bordeaux); border-radius: 0; box-shadow: none; }
    .legende .titre-leg { font-family: var(--serif); font-size: 11pt; font-weight: 700; margin-bottom: .4mm; }

    .nord { position: absolute; right: 2mm; top: 34mm; width: 11mm; text-align: center; font: 700 9pt var(--serif); color: var(--brun); }
    .nord svg { display: block; width: 11mm; height: 11mm; }

    /* ---------- résumés ---------- */
    .bas { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 6mm; margin-top: 4mm; padding-top: 4mm; border-top: .3mm solid var(--filet); min-height: 0; }
    .col { display: flex; flex-direction: column; gap: 2.6mm; min-height: 0; }
    .epoque { display: flex; align-items: center; gap: 2mm; margin: 0 0 -.6mm; font-size: 7.6pt; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .epoque::after { content: ''; flex: 1; height: .3mm; background: currentColor; opacity: .35; }
    .epoque + .epoque, .monu + .epoque { margin-top: 1.6mm; }
    .monu { display: grid; grid-template-columns: 6.2mm 1fr; gap: 0 2mm; }
    .num { width: 6.2mm; height: 6.2mm; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 8.6pt/1 var(--sans); box-shadow: inset 0 -.5mm 0 rgba(0,0,0,.18); }
    .monu h3 { margin: 0; font-family: var(--serif); font-size: 12.6pt; font-weight: 700; line-height: 1.05; }
    .monu .dates { display: block; margin-top: .3mm; font-size: 7pt; font-weight: 600; letter-spacing: .04em; color: var(--brun-doux); }
    .monu p { grid-column: 2; margin: .9mm 0 0; font-size: 8.3pt; line-height: 1.36; }

    .qr-bloc { margin-top: auto; padding: 3mm 3mm 2.6mm; background: #fffaf0; border: .5mm solid var(--brun); border-radius: 3mm; text-align: center; }
    .qr-bloc .appel { margin: 0; font-family: var(--serif); font-size: 14pt; font-weight: 700; line-height: 1.02; }
    .qr { width: 37mm; height: 37mm; margin: 2.4mm auto 0; }
    .qr svg { display: block; width: 100%; height: 100%; }
    .qr-bloc .plus { margin: 2mm 0 0; font-size: 7.2pt; line-height: 1.35; color: var(--brun-doux); }
    .qr-bloc .url { margin: 1mm 0 0; font-size: 7pt; font-weight: 600; color: var(--bordeaux); word-break: break-all; }

    .pied { flex: none; display: flex; justify-content: space-between; gap: 6mm; margin-top: 3mm; font-size: 6.4pt; color: var(--brun-doux); }

    .boutons { display: flex; justify-content: center; gap: 10px; margin: 0 0 14px; }
    .boutons button { padding: 9px 18px; border: 0; border-radius: 999px; background: var(--bordeaux); color: #fff; font: 600 14px var(--sans); cursor: pointer; }
    @media print {
      body { background: none; }
      .affiche { margin: 0; box-shadow: none; }
      .boutons { display: none; }
    }
  </style>
</head>
<body>
  <main class="affiche">
    <div class="carte" id="carte">
      <img src="img/affiche/carte-a3.jpg" alt="La carte en relief du centre de Bordeaux, de la gare Saint-Jean à la Cité du Vin">
      <svg class="calque" id="calque" viewBox="0 0 1200 918" aria-hidden="true"></svg>

      <div class="titre">
        <p class="kicker">Bordeaux · Patrimoine mondial de l'UNESCO</p>
        <h1>Port de la Lune</h1>
        <p class="sous">Les monuments historiques de Bordeaux, en relief</p>
        <p class="intro">Deux mille ans d’histoire, de l’amphithéâtre romain à la Cité du Vin.</p>
      </div>

      <div class="nord"><svg viewBox="0 0 24 24"><path d="M12 2 17 20 12 16.5 7 20z" fill="#3b2a1d"/><path d="M12 2 12 16.5 7 20z" fill="#74604b"/></svg>N</div>

      <div class="legende" id="legende"></div>
    </div>

    <section class="bas" id="bas"></section>

    <footer class="pied">
      <span id="hotel"></span>
      <span>Fond de carte : IGN BD TOPO et OpenStreetMap · Textes : fiches de l’application Port de la Lune</span>
    </footer>
  </main>
  <div class="boutons"><button onclick="print()">Imprimer l’affiche (A3)</button></div>

  <script src="vendor/qrcode.js"></script>
  <script>
    const URL_SITE = 'https://ubik2077.github.io/bordeaux-patrimoine/';

    // ordre chronologique (numéros de la carte) et résumé de chaque monument, tirés des fiches
    const RESUMES = [
      ['gallien', 'Les ruines de l’amphithéâtre de Burdigala, qui accueillait environ 22 000 spectateurs. Le seul vestige antique visible de Bordeaux, caché entre les maisons.'],
      ['seurin', 'Une basilique bâtie sur un cimetière des premiers chrétiens, avec sa crypte ouverte au public. Étape des chemins de Saint-Jacques, inscrite à l’UNESCO.'],
      ['saintecroix', 'La façade romane sculptée d’une ancienne abbaye bénédictine. Seul le clocher de droite est d’origine : celui de gauche date de 1865.'],
      ['cathedrale', 'Aliénor d’Aquitaine y épouse le futur roi Louis VII en 1137. Rebâtie du XIIᵉ au XVᵉ siècle, elle est inscrite à l’UNESCO.'],
      ['grossecloche', 'Une porte de l’enceinte médiévale devenue beffroi. Sa cloche de 7,8 tonnes annonçait les vendanges ; elle figure sur les armoiries de la ville.'],
      ['saintmichel', 'L’église des marins et des artisans. Sa flèche isolée, haute de 114 m, est le plus haut clocher du Midi ; on y monte en saison.'],
      ['peyberland', 'Le clocher de la cathédrale, bâti à l’écart et coiffé d’une Vierge dorée. 233 marches mènent à l’une des plus belles vues sur Bordeaux.'],
      ['cailhau', 'Porte fortifiée et arc de triomphe à la gloire de Charles VIII, face à la Garonne. Son nom vient du gascon calhau, « caillou ».'],
      ['notredame', 'Une église baroque inspirée du Gesù de Rome, près du Grand Théâtre. Réputée pour son acoustique, elle accueille souvent des concerts.'],
      ['bourse', 'La place royale qui a ouvert la ville sur la Garonne, à la place des remparts. À la belle saison, le Miroir d’eau reflète ses façades.'],
      ['aquitaine', 'L’arc classique de la place de la Victoire, au bout de la rue Sainte-Catherine. Il remplace une porte gothique de 1302.'],
      ['bourgogne', 'L’entrée officielle de la ville sur la route de Paris. Le pont de pierre a rehaussé la place : la porte est aujourd’hui en partie enterrée.'],
      ['rohan', 'Le palais d’un archevêque, où Napoléon Iᵉʳ a séjourné, devenu l’hôtel de ville en 1836. Son jardin est ouvert au public.'],
      ['grandtheatre', 'Le chef-d’œuvre de l’architecte Victor Louis, inauguré en 1780. Siège de l’Opéra national, à découvrir lors d’un spectacle ou d’une visite guidée.'],
      ['pontdepierre', 'Le premier pont de Bordeaux, voulu par Napoléon et ouvert en 1822. Ses 17 arches pour les 17 lettres de « Napoléon Bonaparte » ? Une légende.'],
      ['synagogue', 'L’une des plus vastes synagogues d’Europe, siège de la communauté séfarade, en retrait de la rue Sainte-Catherine.'],
      ['garesaintjean', 'La grande gare et sa longue verrière, à deux pas de l’hôtel. Paris n’est plus qu’à 2 h 04. Contrairement à la légende, Eiffel ne l’a pas conçue.'],
      ['girondins', 'Une colonne de 43 m et ses fontaines de bronze, place des Quinconces, en hommage aux députés girondins de la Révolution.'],
      ['boursetravail', 'Un palais Art déco des années 1930, orné d’un grand bas-relief. À l’intérieur, une fresque de Jean Dupas célèbre Bordeaux.'],
      ['tribunal', 'Le tribunal de Richard Rogers, l’un des architectes du Centre Pompidou : ses salles d’audience en forme de cuves se devinent derrière le verre.'],
      ['chaban', 'Un pont levant géant : sa travée centrale, longue de 117 m, monte jusqu’à 55 m pour laisser passer les navires.'],
      ['citeduvin', 'Le grand lieu culturel des vins du monde, à la silhouette tourbillonnante, dans le quartier de Bacalan. Dégustation au belvédère.'],
    ];
    // répartition dans les quatre colonnes (numéros de fin de colonne) ; la dernière garde la place du QR code
    const COLONNES = [6, 12, 18, 22];

    // décalage de la tête de chaque épingle par rapport au pied, en unités de la carte (1200 de large) :
    // les monuments très proches les uns des autres ont des épingles inclinées pour ne pas se chevaucher
    const TETE = { dx: 0, dy: -30 };
    const DECALAGES = { cathedrale: { dx: -9 }, peyberland: { dx: 9 } };

    const NS = 'http://www.w3.org/2000/svg';
    const el = (nom, attrs, parent) => { const e = document.createElementNS(NS, nom); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); parent?.appendChild(e); return e; };
    const echap = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    // typographie française : espace insécable après un nombre (22 000, 114 m), avant ; : ? ! » et après «, pour ne jamais les isoler en début de ligne
    const insecables = (s) => s.replace(/(\d) /g, '$1\u00a0').replace(/ ([;:?!»])/g, '\u202f$1').replace(/« /g, '«\u202f');

    Promise.all([fetch('data/monuments.json').then((r) => r.json()), fetch('img/affiche/carte-a3.json').then((r) => r.json())]).then(([d, pos]) => {
      const parId = Object.fromEntries(d.monuments.map((m) => [m.id, m]));
      const ep = d.epoques;
      const W = 1200, H = 1200 / pos.ratio;
      const xy = ([x, y]) => [x / 100 * W, y / 100 * H];
      const svg = document.getElementById('calque');

      // promenades : pointillés bordeaux sur un liseré clair
      for (const p of pos.promenades) {
        const pts = p.trace.map((q) => xy(q).map((v) => v.toFixed(1)).join(',')).join(' ');
        el('polyline', { points: pts, fill: 'none', stroke: '#fffaf0', 'stroke-width': 5.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .9 }, svg);
        el('polyline', { points: pts, fill: 'none', stroke: '#7a2340', 'stroke-width': 2.6, 'stroke-dasharray': '0.1 6', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
      }

      // la Garonne
      const g = el('text', { x: 852, y: 140, transform: 'rotate(-27 852 140)', 'text-anchor': 'middle', 'font-family': 'Cormorant Garamond, serif', 'font-style': 'italic', 'font-weight': 600, 'font-size': 26, fill: '#2d5a86', 'letter-spacing': 3, opacity: .85 }, svg);
      g.textContent = 'La Garonne';

      // épingles (pied, tige, tête numérotée), dans un groupe à ombre portée ; tiges d'abord, têtes par-dessus
      el('filter', { id: 'ombre', x: '-50%', y: '-50%', width: '200%', height: '200%' }, el('defs', {}, svg))
        .innerHTML = '<feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-opacity=".3"/>';
      const tiges = el('g', {}, svg), tetes = el('g', { filter: 'url(#ombre)' }, svg);
      const epingle = (pied, couleur, texte, decal, carre) => {
        const [x, y] = xy(pied);
        const { dx, dy } = { ...TETE, ...decal };
        const hx = x + dx, hy = y + dy;
        el('ellipse', { cx: x, cy: y, rx: 3.2, ry: 1.8, fill: 'rgba(0,0,0,.35)' }, tiges);
        el('line', { x1: x, y1: y, x2: hx, y2: hy, stroke: couleur, 'stroke-width': 1.8 }, tiges);
        if (carre) el('rect', { x: hx - 11, y: hy - 11, width: 22, height: 22, rx: 4, fill: couleur, stroke: '#fff', 'stroke-width': 2.4 }, tetes);
        else el('circle', { cx: hx, cy: hy, r: 11.5, fill: couleur, stroke: '#fff', 'stroke-width': 2.4 }, tetes);
        el('text', { x: hx, y: hy + 4.6, 'text-anchor': 'middle', 'font-family': 'Inter, sans-serif', 'font-weight': 700, 'font-size': texte.length > 1 ? 12.5 : 13.5, fill: '#fff' }, tetes).textContent = texte;
      };
      epingle(pos.hotel, '#22252b', 'H', DECALAGES.hotel, true);
      RESUMES.forEach(([id], i) => epingle(pos.points[id], ep[parId[id].epoque].color, String(i + 1), DECALAGES[id]));

      // légende des époques
      const compte = {};
      for (const [id] of RESUMES) compte[parId[id].epoque] = (compte[parId[id].epoque] || 0) + 1;
      document.getElementById('legende').innerHTML = '<span class="titre-leg">Légende</span>' +
        Object.entries(ep).map(([k, e]) => `<span><i style="background:${e.color}"></i>${e.label}</span>`).join('') +
        '<span><i class="h"></i>Votre hôtel</span><span><i class="pr"></i>Les 3 promenades à pied de l’application</span>';

      // résumés en quatre colonnes, avec un intertitre à chaque changement d'époque
      const bas = document.getElementById('bas');
      let debut = 0;
      COLONNES.forEach((fin, c) => {
        let html = '', courante = null;
        RESUMES.slice(debut, fin).forEach(([id, resume], j) => {
          const m = parId[id], e = ep[m.epoque];
          if (m.epoque !== courante) { courante = m.epoque; html += `<p class="epoque" style="color:${e.color}">${e.label}</p>`; }
          html += `<article class="monu"><span class="num" style="background:${e.color}">${debut + j + 1}</span>` +
            `<h3>${echap(m.name)}<span class="dates">${echap(m.dates)}</span></h3><p>${insecables(echap(resume))}</p></article>`;
        });
        if (c === COLONNES.length - 1) html += '<div class="qr-bloc"><p class="appel">Emportez la carte<br>sur votre téléphone</p><div class="qr" id="qr"></div>' +
          '<p class="plus">Gratuit, sans installation · 5 langues</p><p class="url" id="url"></p></div>';
        bas.insertAdjacentHTML('beforeend', `<div class="col">${html}</div>`);
        debut = fin;
      });

      const qr = qrcode(0, 'M');
      qr.addData(URL_SITE); qr.make();
      document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      document.getElementById('url').textContent = URL_SITE.replace('https://', '').replace(/\/$/, '');
      document.getElementById('hotel').textContent = d.hotel?.name || '';
    });
  </script>
</body>
</html>
